[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "super-scholar-backend"
version = "3.11.0"
description = "Backend foundation and research understanding engine for Super Scholar"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<0.129",
  "uvicorn[standard]>=0.48,<0.49",
  "sqlalchemy>=2.0.50,<2.1",
  "httpx>=0.28,<0.29",
  "pydantic-settings>=2.14,<3",
  "python-multipart>=0.0.20,<0.1",
  "beautifulsoup4>=4.14,<5",
  "lxml>=6.0,<7",
  "PyYAML>=6.0,<7",
  "alembic>=1.19.1,<1.20",
  "tzdata>=2025.2",
  "pymupdf>=1.27,<2",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "Pillow>=11,<13",
  "pytesseract>=0.3.13,<0.4",
  "openai>=2.9,<3",
  "cryptography>=45,<47"
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]
test = ["pytest>=9,<10"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["data*", "storage*", "migrations*", "scripts*", "tests*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
